<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Envio de Arquivos - Influência</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input, select, button {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 20px;
      background-color: #4285f4;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <form id="uploadForm">
    <h2>Envio de Arquivos - Campanhas de Influência</h2>

    <label>Nome da Agência*</label>
    <input type="text" name="agencia" required>

    <label>Nome da Marca*</label>
    <input type="text" name="marca" required>

    <label>Nome do Solicitante*</label>
    <input type="text" name="solicitante" required>

    <label>Email do Solicitante*</label>
    <input type="email" name="email" required>

    <label>Nome da Campanha*</label>
    <input type="text" name="campanha" required>

    <label>Nome do Influenciador*</label>
    <input type="text" name="influenciador" required>

    <label>Rede Social*</label>
    <select name="rede" required>
      <option value="">Selecione</option>
      <option>Instagram</option>
      <option>TikTok</option>
      <option>Youtube</option>
      <option>Facebook</option>
      <option>Outros</option>
    </select>

    <label>Tipo de Conteúdo*</label>
    <select name="tipo" required>
      <option value="">Selecione</option>
      <option>Feed</option>
      <option>Stories</option>
      <option>Reels</option>
      <option>Vídeo</option>
      <option>Outro</option>
    </select>

    <label>Data da Publicação*</label>
    <input type="date" name="data" required>

    <label>Arquivo(s)*</label>
    <input type="file" name="arquivo" accept="image/*,application/pdf" required>

    <button type="submit">Enviar</button>
  </form>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const form = e.target;
      const formData = new FormData(form);

      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbxk3DexqKjkxjYjmuRWcEmd8_vCZNJLCD_-3Z_Cy1DdCSX6X31P1PltHlXRJi_5U2lh/exec", {
          method: "POST",
          body: formData
        });

        if (response.ok) {
          alert("Arquivo enviado com sucesso!");
          form.reset();
        } else {
          const errorText = await response.text();
          alert("Erro no envio: " + errorText);
        }
      } catch (error) {
        alert("Erro ao conectar com o servidor: " + error.message);
      }
    });
  </script>
</body>
</html>
